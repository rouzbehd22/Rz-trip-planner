<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trip Planner">
<meta name="theme-color" content="#1a1a2e">
<title>Trip Planner</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap');

  :root {
    --bg: #0f0f1a;
    --bg2: #1a1a2e;
    --bg3: #16213e;
    --card: #1e1e35;
    --card2: #252540;
    --border: rgba(255,255,255,0.08);
    --accent: #e8a84c;
    --accent2: #c97d2e;
    --blue: #4a9eff;
    --green: #4caf82;
    --red: #e85c4a;
    --yellow: #f0c040;
    --text: #f0ede8;
    --text2: #a8a4b8;
    --text3: #6b6880;
    --radius: 16px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%; width: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
    position: fixed;
  }

  /* ── SCREENS ── */
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
  .screen.active { opacity: 1; pointer-events: all; }

  /* ── WELCOME SCREEN ── */
  #welcome {
    background: linear-gradient(160deg, #0f0f1a 0%, #1a1a2e 50%, #0d1b35 100%);
    align-items: center; justify-content: center; gap: 0; padding: 40px 32px;
    padding-top: calc(var(--safe-top) + 40px);
    padding-bottom: calc(var(--safe-bottom) + 40px);
  }
  .welcome-star { font-size: 56px; margin-bottom: 24px; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .welcome-title { font-family: 'Playfair Display', serif; font-size: 36px; font-weight: 700; color: var(--text); text-align: center; line-height: 1.2; margin-bottom: 12px; }
  .welcome-sub { font-size: 15px; color: var(--text2); text-align: center; line-height: 1.6; margin-bottom: 40px; max-width: 280px; }
  .load-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #1a0e00; font-family: 'DM Sans', sans-serif; font-weight: 600;
    font-size: 16px; border: none; border-radius: 50px; padding: 16px 40px;
    cursor: pointer; box-shadow: 0 8px 32px rgba(232,168,76,0.3);
    transition: transform 0.15s, box-shadow 0.15s; margin-bottom: 16px;
    width: 100%; max-width: 280px;
  }
  .load-btn:active { transform: scale(0.96); box-shadow: 0 4px 16px rgba(232,168,76,0.2); }
  .load-hint { font-size: 12px; color: var(--text3); text-align: center; }
  #file-input { display: none; }

  /* loaded trip on welcome */
  .loaded-trip-card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 20px; width: 100%; max-width: 320px; margin-bottom: 24px;
    cursor: pointer; transition: background 0.15s;
  }
  .loaded-trip-card:active { background: var(--card2); }
  .ltc-label { font-size: 11px; color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .ltc-name { font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .ltc-meta { font-size: 13px; color: var(--text2); }
  .open-btn {
    background: var(--blue); color: #fff; font-family: 'DM Sans', sans-serif;
    font-weight: 600; font-size: 15px; border: none; border-radius: 50px;
    padding: 14px 36px; cursor: pointer; width: 100%; max-width: 280px;
    transition: transform 0.15s; margin-bottom: 12px;
  }
  .open-btn:active { transform: scale(0.96); }

  /* ── TRIP SCREEN ── */
  #trip { background: var(--bg); }

  .trip-header {
    background: linear-gradient(180deg, var(--bg2) 0%, var(--bg) 100%);
    padding: calc(var(--safe-top) + 14px) 20px 12px;
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .trip-header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .trip-name { font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 600; color: var(--text); }
  .change-btn { font-size: 12px; color: var(--accent); font-weight: 500; background: none; border: none; cursor: pointer; padding: 4px 8px; }
  .trip-meta-row { display: flex; gap: 12px; }
  .meta-chip { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px; font-size: 12px; color: var(--text2); }
  .meta-chip span { color: var(--accent); font-weight: 600; }

  /* day strip */
  .day-strip-wrap { flex-shrink: 0; padding: 12px 0 0; background: var(--bg); border-bottom: 1px solid var(--border); }
  .day-strip { display: flex; gap: 8px; padding: 0 16px 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .day-strip::-webkit-scrollbar { display: none; }
  .day-chip {
    flex-shrink: 0; scroll-snap-align: start;
    background: var(--card); border: 1.5px solid var(--border);
    border-radius: 12px; padding: 8px 12px; cursor: pointer;
    transition: all 0.15s; min-width: 80px; text-align: center;
  }
  .day-chip.active { background: var(--accent); border-color: var(--accent); }
  .day-chip.unbooked { border-color: var(--red); }
  .day-chip-num { font-size: 10px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; }
  .day-chip.active .day-chip-num { color: rgba(0,0,0,0.6); }
  .day-chip-city { font-size: 12px; font-weight: 600; color: var(--text); margin-top: 2px; white-space: nowrap; }
  .day-chip.active .day-chip-city { color: #1a0e00; }
  .day-chip-date { font-size: 10px; color: var(--text3); margin-top: 1px; }
  .day-chip.active .day-chip-date { color: rgba(0,0,0,0.5); }

  /* day panel */
  .day-panel { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: calc(var(--safe-bottom) + 16px); scrollbar-width: none; }
  .day-panel::-webkit-scrollbar { display: none; }

  .day-header { margin-bottom: 16px; }
  .dh-day { font-size: 11px; color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .dh-title { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 700; color: var(--text); margin-bottom: 6px; line-height: 1.2; }
  .dh-tag { font-size: 13px; color: var(--text2); }

  .drive-bar {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 16px; margin-bottom: 16px; display: flex; align-items: center; gap: 12px;
  }
  .drive-icon { font-size: 20px; }
  .drive-info { flex: 1; }
  .drive-route { font-size: 13px; font-weight: 600; color: var(--text); }
  .drive-meta { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .no-drive { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; font-size: 13px; color: var(--text2); display: flex; align-items: center; gap: 10px; }

  .hotel-bar {
    border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; display: flex; align-items: center; gap: 12px;
  }
  .hotel-bar.booked { background: rgba(76,175,130,0.12); border: 1px solid rgba(76,175,130,0.3); }
  .hotel-bar.unbooked { background: rgba(232,92,74,0.12); border: 1px solid rgba(232,92,74,0.4); }
  .hotel-bar.none { background: var(--card); border: 1px solid var(--border); }
  .hotel-icon { font-size: 18px; }
  .hotel-name { font-size: 13px; font-weight: 600; color: var(--text); }
  .hotel-status { font-size: 11px; margin-top: 2px; }
  .hotel-bar.booked .hotel-status { color: var(--green); }
  .hotel-bar.unbooked .hotel-status { color: var(--red); font-weight: 600; }

  .section-title { font-size: 11px; color: var(--text3); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; margin-top: 4px; }

  /* timeline */
  .timeline { display: flex; flex-direction: column; gap: 2px; margin-bottom: 20px; }
  .tl-item { display: flex; gap: 12px; align-items: flex-start; padding: 10px 14px; border-radius: 12px; transition: background 0.15s; }
  .tl-item:active { background: var(--card2); }
  .tl-time { font-size: 11px; color: var(--text3); min-width: 44px; padding-top: 2px; }
  .tl-icon { font-size: 16px; min-width: 20px; text-align: center; padding-top: 1px; }
  .tl-content { flex: 1; }
  .tl-name { font-size: 14px; font-weight: 500; color: var(--text); line-height: 1.3; }
  .tl-name.booked { color: var(--green); }
  .tl-desc { font-size: 12px; color: var(--text2); margin-top: 3px; line-height: 1.4; }

  /* bookings */
  .bookings { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
  .bk-item { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; border: 1px solid; }
  .bk-item.urgent { background: rgba(232,92,74,0.08); border-color: rgba(232,92,74,0.3); }
  .bk-item.soon { background: rgba(240,192,64,0.08); border-color: rgba(240,192,64,0.3); }
  .bk-item.relaxed { background: rgba(76,175,130,0.08); border-color: rgba(76,175,130,0.3); }
  .bk-icon { font-size: 18px; min-width: 24px; }
  .bk-name { font-size: 13px; font-weight: 600; color: var(--text); }
  .bk-sub { font-size: 11px; color: var(--text2); margin-top: 3px; }
  .bk-badge { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; display: inline-block; padding: 2px 7px; border-radius: 4px; }
  .bk-item.urgent .bk-badge { background: rgba(232,92,74,0.2); color: var(--red); }
  .bk-item.soon .bk-badge { background: rgba(240,192,64,0.2); color: var(--yellow); }
  .bk-item.relaxed .bk-badge { background: rgba(76,175,130,0.2); color: var(--green); }

  /* confirmed bookings tab */
  .confirmed-section { margin-bottom: 20px; }
  .conf-item { background: var(--card); border: 1px solid rgba(76,175,130,0.3); border-radius: 12px; padding: 14px 16px; margin-bottom: 8px; }
  .conf-what { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .conf-meta { font-size: 12px; color: var(--text2); line-height: 1.5; }
  .conf-locator { font-size: 12px; color: var(--accent); font-weight: 600; margin-top: 4px; }

  /* hotels overview tab */
  .hotels-list { display: flex; flex-direction: column; gap: 8px; }
  .hl-item { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
  .hl-item.unbooked { border-color: rgba(232,92,74,0.4); background: rgba(232,92,74,0.06); }
  .hl-night { font-size: 11px; color: var(--text3); min-width: 48px; }
  .hl-info { flex: 1; }
  .hl-hotel { font-size: 13px; font-weight: 600; color: var(--text); }
  .hl-city { font-size: 11px; color: var(--text2); margin-top: 2px; }
  .hl-status { font-size: 11px; font-weight: 600; }
  .hl-status.booked { color: var(--green); }
  .hl-status.unbooked { color: var(--red); }

  /* bottom tabs */
  .bottom-tabs {
    flex-shrink: 0; display: flex; background: var(--bg2);
    border-top: 1px solid var(--border);
    padding-bottom: calc(var(--safe-bottom) + 0px);
  }
  .tab-btn { flex: 1; padding: 10px 0; background: none; border: none; color: var(--text3); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; transition: color 0.15s; }
  .tab-btn.active { color: var(--accent); }
  .tab-btn svg { width: 20px; height: 20px; }
  .tab-label { font-size: 10px; font-weight: 500; }

  /* tab panels */
  .tab-panel { display: none; flex: 1; overflow-y: auto; padding: 16px; padding-bottom: calc(var(--safe-bottom) + 16px); scrollbar-width: none; }
  .tab-panel::-webkit-scrollbar { display: none; }
  .tab-panel.visible { display: block; }

  /* offline badge */
  .offline-badge { position: fixed; bottom: calc(var(--safe-bottom) + 72px); left: 50%; transform: translateX(-50%); background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 6px 16px; font-size: 12px; color: var(--text2); display: none; z-index: 100; }
  .offline-badge.show { display: block; }

</style>
</head>
<body>

<!-- WELCOME SCREEN -->
<div class="screen active" id="welcome">
  <div class="welcome-star">🗺️</div>
  <div class="welcome-title">Trip Planner</div>
  <div class="welcome-sub">Your offline travel companion. Load a trip file from Claude and explore your itinerary — no internet needed.</div>

  <div id="loaded-trip-section" style="display:none; width:100%; max-width:320px;">
    <div class="loaded-trip-card" id="loaded-trip-card">
      <div class="ltc-label">Last loaded trip</div>
      <div class="ltc-name" id="ltc-name">—</div>
      <div class="ltc-meta" id="ltc-meta">—</div>
    </div>
    <button class="open-btn" id="open-saved-btn">Open This Trip</button>
  </div>

  <button class="load-btn" id="load-btn-welcome">📂 Load Trip File (.json)</button>
  <input type="file" id="file-input" accept=".json">
  <div class="load-hint">Get trip files from Claude → export as .json</div>
</div>

<!-- TRIP SCREEN -->
<div class="screen" id="trip">
  <div class="trip-header">
    <div class="trip-header-top">
      <div class="trip-name" id="trip-name-header">Loading...</div>
      <button class="change-btn" id="change-trip-btn">Change</button>
    </div>
    <div class="trip-meta-row" id="trip-meta-row"></div>
  </div>

  <!-- TAB PANELS -->
  <div class="tab-panel visible" id="panel-days">
    <div class="day-strip-wrap" style="margin: -16px -16px 16px; padding: 0;">
      <div class="day-strip" id="day-strip"></div>
    </div>
    <div id="day-content"></div>
  </div>

  <div class="tab-panel" id="panel-bookings">
    <div class="section-title" style="margin-bottom:14px;">✅ Confirmed Bookings</div>
    <div class="confirmed-section" id="confirmed-list"></div>
    <div class="section-title" style="margin-bottom:14px; margin-top:8px;">⚠️ Still To Book</div>
    <div id="still-to-book-list"></div>
  </div>

  <div class="tab-panel" id="panel-hotels">
    <div class="section-title" style="margin-bottom:14px;">🏨 Hotels Overview</div>
    <div class="hotels-list" id="hotels-list"></div>
  </div>

  <!-- BOTTOM TABS -->
  <div class="bottom-tabs">
    <button class="tab-btn active" data-panel="days">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span class="tab-label">Days</span>
    </button>
    <button class="tab-btn" data-panel="bookings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
      <span class="tab-label">Bookings</span>
    </button>
    <button class="tab-btn" data-panel="hotels">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span class="tab-label">Hotels</span>
    </button>
  </div>
</div>

<div class="offline-badge" id="offline-badge">✈️ Offline mode</div>

<script>
let tripData = null;
let currentDay = 0;

// ── STORAGE ──
function saveTrip(data) {
  try { localStorage.setItem('trip_data', JSON.stringify(data)); } catch(e) {}
}
function loadSavedTrip() {
  try { const d = localStorage.getItem('trip_data'); return d ? JSON.parse(d) : null; } catch(e) { return null; }
}

// ── FILE LOAD ──
document.getElementById('file-input').addEventListener('change', function(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const data = JSON.parse(ev.target.result);
      tripData = data;
      saveTrip(data);
      renderTrip();
      showScreen('trip');
    } catch(err) { alert('Could not read trip file. Make sure it\'s a valid .json from Claude.'); }
  };
  reader.readAsText(file);
  e.target.value = '';
});

document.getElementById('load-btn-welcome').addEventListener('click', () => {
  document.getElementById('file-input').click();
});

document.getElementById('change-trip-btn').addEventListener('click', () => {
  showScreen('welcome');
});

// check for saved trip
window.addEventListener('load', () => {
  const saved = loadSavedTrip();
  if (saved) {
    document.getElementById('loaded-trip-section').style.display = 'block';
    document.getElementById('ltc-name').textContent = saved.tripName || 'My Trip';
    document.getElementById('ltc-meta').textContent = `${saved.dates || ''} · ${saved.totalDays || '?'} days`;
    document.getElementById('open-saved-btn').addEventListener('click', () => {
      tripData = saved;
      renderTrip();
      showScreen('trip');
    });
  }
});

// ── SCREENS ──
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ── RENDER TRIP ──
function renderTrip() {
  const d = tripData;
  document.getElementById('trip-name-header').textContent = d.tripName || 'My Trip';

  // meta chips
  const metaRow = document.getElementById('trip-meta-row');
  metaRow.innerHTML = `
    <div class="meta-chip"><span>${d.totalDays}</span> days</div>
    <div class="meta-chip"><span>${d.totalKm?.toLocaleString()}</span> km</div>
    <div class="meta-chip"><span>${d.cities}</span> cities</div>
  `;

  // day strip
  const strip = document.getElementById('day-strip');
  strip.innerHTML = '';
  d.days.forEach((day, i) => {
    const chip = document.createElement('div');
    chip.className = 'day-chip' + (day.hotelStatus === 'unbooked' ? ' unbooked' : '');
    chip.innerHTML = `
      <div class="day-chip-num">${day.day}</div>
      <div class="day-chip-city">${day.city.split('→')[0].split('(')[0].trim()}</div>
      <div class="day-chip-date">${day.date.split(' ').slice(0,2).join(' ')}</div>
    `;
    chip.addEventListener('click', () => selectDay(i));
    strip.appendChild(chip);
  });

  // confirmed bookings
  const confList = document.getElementById('confirmed-list');
  confList.innerHTML = '';
  (d.confirmedBookings || []).forEach(b => {
    confList.innerHTML += `
      <div class="conf-item">
        <div class="conf-what">✅ ${b.what}</div>
        <div class="conf-meta">${b.date} · ${b.time}${b.locator ? '' : ''}</div>
        ${b.locator ? `<div class="conf-locator">Locator: ${b.locator}</div>` : ''}
        <div class="conf-meta" style="margin-top:4px;font-size:11px;">${b.details}</div>
      </div>
    `;
  });

  // still to book — aggregate from all days
  const allBookings = {};
  d.days.forEach(day => {
    (day.bookings || []).forEach(b => {
      if (!allBookings[b.name]) allBookings[b.name] = {...b};
    });
  });
  const stbList = document.getElementById('still-to-book-list');
  stbList.innerHTML = '';
  ['urgent','soon','relaxed'].forEach(urgency => {
    Object.values(allBookings).filter(b => b.urgency === urgency).forEach(b => {
      const label = urgency === 'urgent' ? '🔴 Book now' : urgency === 'soon' ? '🟡 Book soon' : '🟢 Can wait';
      stbList.innerHTML += `
        <div class="bk-item ${urgency}" style="margin-bottom:8px;">
          <div class="bk-icon">${b.icon || '📌'}</div>
          <div>
            <div class="bk-name">${b.name}</div>
            <div class="bk-sub">${b.sub || b.desc || ''}</div>
            <div class="bk-badge">${label}</div>
          </div>
        </div>
      `;
    });
  });

  // hotels list
  const hotelsList = document.getElementById('hotels-list');
  hotelsList.innerHTML = '';
  (d.hotels || []).forEach(h => {
    hotelsList.innerHTML += `
      <div class="hl-item ${h.status}">
        <div class="hl-night">Night ${h.night}<br><span style="color:var(--text3);font-size:10px;">${h.date}</span></div>
        <div class="hl-info">
          <div class="hl-hotel">${h.hotel}</div>
          <div class="hl-city">${h.city}</div>
        </div>
        <div class="hl-status ${h.status}">${h.status === 'booked' ? '✅ Booked' : '⚠️ Unbooked'}</div>
      </div>
    `;
  });

  selectDay(0);
}

// ── SELECT DAY ──
function selectDay(i) {
  currentDay = i;
  const chips = document.querySelectorAll('.day-chip');
  chips.forEach((c, ci) => c.classList.toggle('active', ci === i));

  // scroll chip into view
  chips[i]?.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });

  const day = tripData.days[i];
  const content = document.getElementById('day-content');

  // drive bar
  let driveHTML = '';
  if (day.driveKm) {
    driveHTML = `<div class="drive-bar">
      <div class="drive-icon">🚗</div>
      <div class="drive-info">
        <div class="drive-route">${day.driveRoute || day.city}</div>
        <div class="drive-meta">${day.driveKm} · ${day.driveTime}</div>
      </div>
    </div>`;
  } else if (day.hotelStatus !== 'none') {
    driveHTML = `<div class="no-drive">🏙️ <span>No driving today</span></div>`;
  }

  // hotel bar
  let hotelHTML = '';
  if (day.hotelStatus === 'booked') {
    hotelHTML = `<div class="hotel-bar booked"><div class="hotel-icon">🏨</div><div><div class="hotel-name">${day.sleep}</div><div class="hotel-status">✅ Booked</div></div></div>`;
  } else if (day.hotelStatus === 'unbooked') {
    hotelHTML = `<div class="hotel-bar unbooked"><div class="hotel-icon">⚠️</div><div><div class="hotel-name">${day.sleep}</div><div class="hotel-status">UNBOOKED — action needed</div></div></div>`;
  } else if (day.hotelStatus === 'none') {
    hotelHTML = `<div class="hotel-bar none"><div class="hotel-icon">✈️</div><div><div class="hotel-name">Departure day</div><div class="hotel-status" style="color:var(--text2);">Fly home</div></div></div>`;
  }

  // timeline
  const tlHTML = (day.timeline || []).map(t => {
    const isBooked = (t.name || '').includes('BOOKED') || (t.desc || '').startsWith('BOOKED');
    return `<div class="tl-item">
      <div class="tl-time">${t.time}</div>
      <div class="tl-icon">${t.icon || '•'}</div>
      <div class="tl-content">
        <div class="tl-name ${isBooked ? 'booked' : ''}">${t.name}</div>
        <div class="tl-desc">${t.desc || ''}</div>
      </div>
    </div>`;
  }).join('');

  // bookings
  const bkHTML = (day.bookings || []).map(b => {
    const label = b.urgency === 'urgent' ? '🔴 Book now' : b.urgency === 'soon' ? '🟡 Book soon' : '🟢 Can wait';
    return `<div class="bk-item ${b.urgency}">
      <div class="bk-icon">${b.icon || '📌'}</div>
      <div>
        <div class="bk-name">${b.name}</div>
        <div class="bk-sub">${b.sub || b.desc || ''}</div>
        <div class="bk-badge">${label}</div>
      </div>
    </div>`;
  }).join('');

  content.innerHTML = `
    <div class="day-header">
      <div class="dh-day">${day.day} · ${day.date}</div>
      <div class="dh-title">${day.city}</div>
      ${day.tag ? `<div class="dh-tag">${day.tag}</div>` : ''}
    </div>
    ${driveHTML}
    ${hotelHTML}
    ${day.timeline?.length ? `<div class="section-title">Day plan</div><div class="timeline">${tlHTML}</div>` : ''}
    ${day.bookings?.length ? `<div class="section-title">Reminders</div><div class="bookings">${bkHTML}</div>` : ''}
  `;

  // scroll day panel to top
  document.getElementById('panel-days').scrollTop = 0;
}

// ── BOTTOM TABS ──
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const panel = btn.dataset.panel;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('visible'));
    btn.classList.add('active');
    document.getElementById('panel-' + panel).classList.add('visible');
  });
});

// ── OFFLINE INDICATOR ──
function updateOnlineStatus() {
  document.getElementById('offline-badge').classList.toggle('show', !navigator.onLine);
}
window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);
updateOnlineStatus();

// ── SERVICE WORKER (inline) ──
if ('serviceWorker' in navigator) {
  const swCode = `
    const CACHE = 'trip-planner-v1';
    self.addEventListener('install', e => {
      e.waitUntil(caches.open(CACHE).then(c => c.addAll(['/trip-viewer-app.html'])));
      self.skipWaiting();
    });
    self.addEventListener('activate', e => { self.clients.claim(); });
    self.addEventListener('fetch', e => {
      e.respondWith(caches.match(e.request).then(r => r || fetch(e.request).catch(() => caches.match('/trip-viewer-app.html'))));
    });
  `;
  const blob = new Blob([swCode], { type: 'application/javascript' });
  const swURL = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swURL).catch(() => {});
}
</script>
</body>
</html>
